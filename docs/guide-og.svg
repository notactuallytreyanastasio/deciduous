<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Workflow diagram on left -->
  <g transform="translate(80, 120)">
    <!-- Phase boxes connected by arrows -->
    <!-- User Request -->
    <rect x="20" y="20" width="160" height="50" rx="8" fill="#f59e0b" opacity="0.9"/>
    <text x="100" y="50" font-family="system-ui, sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="600">User Request</text>

    <!-- Arrow down -->
    <line x1="100" y1="75" x2="100" y2="100" stroke="#475569" stroke-width="3"/>
    <polygon points="100,115 92,100 108,100" fill="#475569"/>

    <!-- Log Goal -->
    <rect x="20" y="120" width="160" height="50" rx="8" fill="#3b82f6" opacity="0.9"/>
    <text x="100" y="150" font-family="system-ui, sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="600">Log Goal</text>

    <!-- Arrow down -->
    <line x1="100" y1="175" x2="100" y2="200" stroke="#475569" stroke-width="3"/>
    <polygon points="100,215 92,200 108,200" fill="#475569"/>

    <!-- Explore / Decide -->
    <rect x="20" y="220" width="160" height="50" rx="8" fill="#8b5cf6" opacity="0.9"/>
    <text x="100" y="250" font-family="system-ui, sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="600">Explore / Decide</text>

    <!-- Arrow branching -->
    <line x1="100" y1="275" x2="100" y2="290" stroke="#475569" stroke-width="3"/>
    <line x1="100" y1="290" x2="60" y2="310" stroke="#475569" stroke-width="3"/>
    <line x1="100" y1="290" x2="140" y2="310" stroke="#475569" stroke-width="3"/>

    <!-- Action -->
    <rect x="0" y="315" width="120" height="45" rx="8" fill="#06b6d4" opacity="0.9"/>
    <text x="60" y="343" font-family="system-ui, sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="600">Action</text>

    <!-- Outcome -->
    <rect x="140" y="315" width="120" height="45" rx="8" fill="#22c55e" opacity="0.9"/>
    <text x="200" y="343" font-family="system-ui, sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="600">Outcome</text>

    <!-- Arrows down -->
    <line x1="60" y1="365" x2="60" y2="390" stroke="#475569" stroke-width="2"/>
    <line x1="200" y1="365" x2="200" y2="390" stroke="#475569" stroke-width="2"/>

    <!-- Commit -->
    <rect x="60" y="395" width="200" height="45" rx="8" fill="#1e3a5f" stroke="#334155" stroke-width="2"/>
    <text x="160" y="423" font-family="ui-monospace, monospace" font-size="12" fill="#22c55e" text-anchor="middle">git commit --commit HEAD</text>
  </g>

  <!-- Decorative connecting lines -->
  <g transform="translate(300, 200)">
    <line x1="0" y1="80" x2="120" y2="80" stroke="#334155" stroke-width="2" stroke-dasharray="8,4"/>
    <line x1="0" y1="180" x2="80" y2="180" stroke="#334155" stroke-width="2" stroke-dasharray="8,4"/>
  </g>

  <!-- Main content -->
  <text x="750" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#94a3b8" text-anchor="middle" letter-spacing="0.15em">LEARN THE WORKFLOW</text>

  <text x="750" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="68" font-weight="800" fill="url(#accentGrad)" text-anchor="middle">The Guide</text>

  <text x="750" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#e2e8f0" text-anchor="middle">Commands, patterns, and real-world workflows</text>
  <text x="750" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#94a3b8" text-anchor="middle">Build an e-commerce cart from scratch</text>

  <!-- Section pills -->
  <g transform="translate(500, 370)">
    <rect x="0" y="0" width="130" height="45" rx="22" fill="#1e3a5f"/>
    <text x="65" y="29" font-family="system-ui, sans-serif" font-size="15" fill="#f59e0b" text-anchor="middle" font-weight="600">Commands</text>
  </g>
  <g transform="translate(650, 370)">
    <rect x="0" y="0" width="130" height="45" rx="22" fill="#1e3a5f"/>
    <text x="65" y="29" font-family="system-ui, sans-serif" font-size="15" fill="#3b82f6" text-anchor="middle" font-weight="600">Patterns</text>
  </g>
  <g transform="translate(800, 370)">
    <rect x="0" y="0" width="150" height="45" rx="22" fill="#1e3a5f"/>
    <text x="75" y="29" font-family="system-ui, sans-serif" font-size="15" fill="#22c55e" text-anchor="middle" font-weight="600">Real Scenario</text>
  </g>

  <!-- Phases indicator -->
  <g transform="translate(530, 440)">
    <text x="220" y="25" font-family="system-ui, sans-serif" font-size="16" fill="#64748b" text-anchor="middle">6 phases from request to context recovery</text>

    <!-- Phase dots -->
    <circle cx="100" cy="55" r="8" fill="#f59e0b"/>
    <circle cx="140" cy="55" r="8" fill="#8b5cf6"/>
    <circle cx="180" cy="55" r="8" fill="#3b82f6"/>
    <circle cx="220" cy="55" r="8" fill="#06b6d4"/>
    <circle cx="260" cy="55" r="8" fill="#ef4444"/>
    <circle cx="300" cy="55" r="8" fill="#22c55e"/>

    <!-- Connecting line -->
    <line x1="108" y1="55" x2="292" y2="55" stroke="#334155" stroke-width="2"/>
  </g>

  <!-- DECIDUOUS branding -->
  <text x="750" y="555" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#64748b" text-anchor="middle" letter-spacing="0.15em">DECIDUOUS</text>
  <text x="750" y="590" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#475569" text-anchor="middle">deciduous.dev/guide</text>

  <!-- Decorative elements -->
  <circle cx="1100" cy="120" r="70" fill="#f59e0b" opacity="0.1"/>
  <circle cx="1080" cy="480" r="100" fill="#22c55e" opacity="0.08"/>
  <circle cx="50" cy="560" r="50" fill="#8b5cf6" opacity="0.1"/>
</svg>
