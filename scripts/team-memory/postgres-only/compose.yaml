# Database only. Run the Deciduous MCP service separately.
services:
  db:
    build:
      context: .
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?missing POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?missing POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
