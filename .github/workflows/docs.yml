name: Documentation checks
on:
  pull_request:
    paths: ['docs/**', 'scripts/docs/**', 'scripts/team-memory/**', '.github/workflows/docs.yml']
  push:
    branches: [main]
    paths: ['docs/**', 'scripts/docs/**', 'scripts/team-memory/**', '.github/workflows/docs.yml']
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/docs/package-lock.json
      - run: npm ci --prefix scripts/docs --ignore-scripts
      - run: npm run check --prefix scripts/docs
