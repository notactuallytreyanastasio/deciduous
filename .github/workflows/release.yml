name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag or ref to validate (use a version tag when publishing)'
        required: true
        type: string
      publish:
        description: 'Publish the validated version tag to GitHub and crates.io'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate-ref:
    name: Validate and pin the requested revision
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.revision.outputs.ref }}
      tag: ${{ steps.revision.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require an existing version tag for publishing
        id: revision
        env:
          REQUESTED_REF: ${{ inputs.tag || github.ref }}
          PUBLISH_REQUESTED: ${{ github.event_name == 'push' || inputs.publish == true }}
        run: |
          revision=$(git rev-parse HEAD)
          tag=
          if [ "$PUBLISH_REQUESTED" = true ]; then
            tag="${REQUESTED_REF#refs/tags/}"
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
              echo 'Publishing requires an existing vMAJOR.MINOR.PATCH version tag.' >&2
              exit 1
            fi
            if ! revision=$(git rev-parse --verify "refs/tags/${tag}^{commit}"); then
              echo "Publishing tag does not exist: $tag" >&2
              exit 1
            fi
          fi
          # Every build and test uses the same commit, even if a branch moves
          # or a branch and tag happen to have the same name.
          printf 'ref=%s\ntag=%s\n' "$revision" "$tag" >> "$GITHUB_OUTPUT"
      - name: Require both package versions to match the publishing tag
        if: github.event_name == 'push' || inputs.publish == true
        env:
          PINNED_REVISION: ${{ steps.revision.outputs.ref }}
          RELEASE_TAG: ${{ steps.revision.outputs.tag }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import sys
          import tomllib

          revision = os.environ["PINNED_REVISION"]
          tag = os.environ["RELEASE_TAG"]
          expected = tag.removeprefix("v")

          def read_manifest(path):
              return subprocess.check_output(
                  ["git", "show", f"{revision}:{path}"], text=True
              )

          try:
              cargo_version = tomllib.loads(read_manifest("Cargo.toml"))["package"]["version"]
              server_match = re.search(
                  r'(?m)^\s*version:\s*"([^"]+)"',
                  read_manifest("deciduous_mcp/mix.exs"),
              )
              if server_match is None:
                  raise ValueError("deciduous_mcp/mix.exs must declare a literal project version")
              versions = {
                  "Cargo.toml": cargo_version,
                  "deciduous_mcp/mix.exs": server_match.group(1),
              }
          except (KeyError, ValueError, subprocess.CalledProcessError) as error:
              sys.exit(f"Cannot verify package versions for {tag}: {error}")

          mismatches = [
              f"{path} declares {actual}; publishing tag {tag} requires {expected}"
              for path, actual in versions.items()
              if actual != expected
          ]
          if mismatches:
              sys.exit("Release version mismatch:\n" + "\n".join(mismatches))
          print(f"Both package versions match {tag} at {revision}")
          PY

  acceptance:
    needs: [validate-ref]
    uses: ./.github/workflows/release-acceptance.yml
    with:
      ref: ${{ needs.validate-ref.outputs.ref }}

  build:
    needs: [validate-ref]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: linux-amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            name: linux-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-amd64
            ext: .exe
          - os: macos-latest
            target: x86_64-apple-darwin
            name: darwin-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: darwin-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-ref.outputs.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools (Linux x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          # Install cross for ARM64 cross-compilation
          cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (Linux x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (Linux ARM64 with cross)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (macOS/Windows)
        if: matrix.os != 'ubuntu-latest'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/deciduous.exe deciduous-${{ matrix.name }}.exe
          else
            cp target/${{ matrix.target }}/release/deciduous deciduous-${{ matrix.name }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deciduous-${{ matrix.name }}
          path: deciduous-${{ matrix.name }}${{ matrix.ext }}

  build-mcp-server:
    name: Build self-contained MCP server (${{ matrix.name }})
    needs: [validate-ref]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: darwin-arm64
            burrito_target: darwin_arm64
          - os: macos-latest
            name: darwin-amd64
            burrito_target: darwin_amd64
          - os: ubuntu-latest
            name: linux-arm64
            burrito_target: linux_arm64
          - os: ubuntu-latest
            name: linux-amd64
            burrito_target: linux_amd64
          - os: ubuntu-latest
            name: windows-amd64
            burrito_target: windows_amd64
            ext: .exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-ref.outputs.ref }}

      - name: Install Erlang and Elixir for the build
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28.3.3'
          elixir-version: '1.18.4'
          version-type: strict

      - name: Install Burrito build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xz-utils p7zip-full

      - name: Install Burrito build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install xz

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: '0.16.0'
          cache-key: ${{ matrix.burrito_target }}

      - name: Build Burrito executable
        working-directory: deciduous_mcp
        env:
          MIX_ENV: prod
          BURRITO_TARGET: ${{ matrix.burrito_target }}
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get --only prod
          mix hex.audit
          mix release deciduous_mcp --overwrite

      - name: Name release artifact
        shell: bash
        run: |
          cp "deciduous_mcp/burrito_out/deciduous_mcp_${{ matrix.burrito_target }}${{ matrix.ext }}" \
            "deciduous-mcp-${{ matrix.name }}${{ matrix.ext }}"

      - name: Upload self-contained MCP server
        uses: actions/upload-artifact@v4
        with:
          name: deciduous-mcp-${{ matrix.name }}
          path: deciduous-mcp-${{ matrix.name }}${{ matrix.ext }}
          if-no-files-found: error

  verify-mcp-binaries:
    name: Verify MCP executable (${{ matrix.name }})
    needs: [build-mcp-server, validate-ref]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-amd64
          - os: ubuntu-24.04-arm
            name: linux-arm64
          - os: macos-15
            name: darwin-arm64
          - os: macos-15-intel
            name: darwin-amd64
          - os: windows-2025
            name: windows-amd64
            ext: .exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-ref.outputs.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: deciduous-mcp-${{ matrix.name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Boot embedded runtime without host Erlang or Elixir
        shell: bash
        run: |
          chmod +x "deciduous-mcp-${{ matrix.name }}${{ matrix.ext }}"
          python deciduous_mcp/test/release/native_smoke.py \
            "./deciduous-mcp-${{ matrix.name }}${{ matrix.ext }}"

  release:
    if: github.event_name == 'push' || inputs.publish == true
    needs: [build, verify-mcp-binaries, acceptance, validate-ref]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-ref.outputs.ref }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -la artifacts/*/

      - name: Stage Postgres bootstrap schema
        run: |
          mkdir -p artifacts/deciduous-mcp-structure
          cp deciduous_mcp/STRUCTURE.sql \
            artifacts/deciduous-mcp-structure/deciduous-mcp-structure.sql

      - name: Package Docker setup
        run: |
          mkdir -p artifacts/deciduous-mcp-docker
          bash deciduous_mcp/scripts/package-docker.sh \
            artifacts/deciduous-mcp-docker/deciduous-mcp-docker.tar.gz

      - name: Create checksums
        run: |
          : > checksums.txt
          for dir in artifacts/*/; do
            (cd "$dir" && sha256sum *) >> checksums.txt
          done
          sort -o checksums.txt checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.validate-ref.outputs.tag }}
          files: |
            artifacts/deciduous-linux-amd64/deciduous-linux-amd64
            artifacts/deciduous-linux-arm64/deciduous-linux-arm64
            artifacts/deciduous-darwin-amd64/deciduous-darwin-amd64
            artifacts/deciduous-darwin-arm64/deciduous-darwin-arm64
            artifacts/deciduous-windows-amd64/deciduous-windows-amd64.exe
            artifacts/deciduous-mcp-linux-amd64/deciduous-mcp-linux-amd64
            artifacts/deciduous-mcp-linux-arm64/deciduous-mcp-linux-arm64
            artifacts/deciduous-mcp-darwin-amd64/deciduous-mcp-darwin-amd64
            artifacts/deciduous-mcp-darwin-arm64/deciduous-mcp-darwin-arm64
            artifacts/deciduous-mcp-windows-amd64/deciduous-mcp-windows-amd64.exe
            artifacts/deciduous-mcp-structure/deciduous-mcp-structure.sql
            artifacts/deciduous-mcp-docker/deciduous-mcp-docker.tar.gz
            checksums.txt
          fail_on_unmatched_files: true
          generate_release_notes: true

  publish-crate:
    if: github.event_name == 'push' || inputs.publish == true
    needs: [build, verify-mcp-binaries, acceptance, validate-ref]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-ref.outputs.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --no-verify

  # Homebrew formula update, folded INTO the release run (needs: release) rather
  # than a separate `on: release` workflow. Two reasons that matters:
  #  - A release created by GITHUB_TOKEN (the `release` job's action) does NOT
  #    trigger `on: release` workflows, so the old standalone update-homebrew.yml
  #    never fired for automated releases (0.15.0, 0.16.0 got no run at all).
  #  - Running after `release` guarantees checksums.txt is attached, so the
  #    download can't race the publish (which is what failed for 0.13.x/0.14.0).
  update-homebrew:
    needs: [release, validate-ref]
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version + tag
        id: rel
        env:
          RELEASE_TAG: ${{ needs.validate-ref.outputs.tag }}
        run: |
          printf 'tag=%s\nversion=%s\n' "$RELEASE_TAG" "${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ steps.rel.outputs.tag }}" \
            --repo "${{ github.repository }}" --pattern "checksums.txt"
          cat checksums.txt

      - name: Parse checksums
        id: sums
        run: |
          for p in darwin-arm64 darwin-amd64 linux-arm64 linux-amd64; do
            key=$(echo "$p" | tr '-' '_')
            # The release also ships `deciduous-mcp-$p`; select the CLI asset
            # exactly so its checksum does not become a multi-line value.
            sum=$(awk -v asset="deciduous-${p}" '$2 == asset {print $1}' checksums.txt)
            test "${#sum}" -eq 64
            echo "${key}=${sum}" >> $GITHUB_OUTPUT
          done

      - name: Generate formula
        env:
          VERSION: ${{ steps.rel.outputs.version }}
          SHA_DARWIN_ARM64: ${{ steps.sums.outputs.darwin_arm64 }}
          SHA_DARWIN_AMD64: ${{ steps.sums.outputs.darwin_amd64 }}
          SHA_LINUX_ARM64: ${{ steps.sums.outputs.linux_arm64 }}
          SHA_LINUX_AMD64: ${{ steps.sums.outputs.linux_amd64 }}
        run: |
          cat > deciduous.rb << FORMULA
          class Deciduous < Formula
            desc "Decision graph tooling for AI-assisted development"
            homepage "https://notactuallytreyanastasio.github.io/deciduous/"
            version "${VERSION}"
            license "Apache-2.0"

            on_macos do
              on_arm do
                url "https://github.com/notactuallytreyanastasio/deciduous/releases/download/v#{version}/deciduous-darwin-arm64"
                sha256 "${SHA_DARWIN_ARM64}"
              end
              on_intel do
                url "https://github.com/notactuallytreyanastasio/deciduous/releases/download/v#{version}/deciduous-darwin-amd64"
                sha256 "${SHA_DARWIN_AMD64}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/notactuallytreyanastasio/deciduous/releases/download/v#{version}/deciduous-linux-arm64"
                sha256 "${SHA_LINUX_ARM64}"
              end
              on_intel do
                url "https://github.com/notactuallytreyanastasio/deciduous/releases/download/v#{version}/deciduous-linux-amd64"
                sha256 "${SHA_LINUX_AMD64}"
              end
            end

            def install
              binary_name = Dir["deciduous-*"].first
              bin.install binary_name => "deciduous"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/deciduous --version")
            end
          end
          FORMULA
          cat deciduous.rb

      - name: Push formula to tap
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no"
          git clone git@github.com:notactuallytreyanastasio/homebrew-tap.git tap
          cp deciduous.rb tap/Formula/deciduous.rb
          cd tap
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add Formula/deciduous.rb
          git diff --cached --quiet || git commit -m "deciduous ${{ steps.rel.outputs.version }}"
          git push
